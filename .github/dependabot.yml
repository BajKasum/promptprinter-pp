version: 2

updates:
  # Hebt die per Commit-SHA gebundenen Actions samt Versionskommentar an.
  # Kein Auto-Merge: jeder Pull Request wartet auf eine Entscheidung.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
