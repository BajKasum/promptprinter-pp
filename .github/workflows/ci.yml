name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Nur lesen. Jede Action hängt an einer Commit-SHA mit Versionskommentar,
# Dependabot hebt beides gemeinsam an.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Pflichtdateien
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: README, Lizenz, Sicherheitsrichtlinie und Projektregeln sind da
        run: test -f README.md && test -f LICENSE && test -f SECURITY.md && test -f CLAUDE.md

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax
        run: npm run check

      - name: Tests
        run: npm test
